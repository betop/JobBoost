<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftCV v0.3</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="popup-container">
      <div class="popup-header">
        <h1>SwiftCV <span style="font-size:0.6em;opacity:0.6;font-weight:400;">v0.3</span></h1>
      </div>

      <div class="popup-content">
        <div class="status-section">
          <h2>Status</h2>
          <div id="statusInfo" class="status-info">
            <p>Loading...</p>
          </div>
        </div>

        <div class="instructions">
          <h3>How to use:</h3>
          <ol>
            <li>Select job description text on any webpage</li>
            <li>Right-click and choose "Generate Resume and Cover Letter"</li>
            <li>Wait for PDFs to be generated and downloaded</li>
          </ol>
        </div>

        <div class="settings-section">
          <h3>Settings</h3>
          <div class="setting-row">
            <label for="chatBubbleToggle" class="setting-label">Show AI Chat Bubble</label>
            <label class="toggle-switch">
              <input type="checkbox" id="chatBubbleToggle" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="setting-row admin-only-row" id="resumeOnlyRow" style="display:none">
            <label for="resumeOnlyToggle" class="setting-label">
              Resume Only
              <span style="display:block;font-size:11px;color:#94a3b8;font-weight:400;">Skip cover letter generation</span>
            </label>
            <label class="toggle-switch">
              <input type="checkbox" id="resumeOnlyToggle" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

      </div>

      <div class="popup-footer">
        <p>Version 1.0.0</p>
      </div>
    </div>

    <!-- Load fonts BEFORE popup.js so they're available in global context -->
    <script src="resume_fonts.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
